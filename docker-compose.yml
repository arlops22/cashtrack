services:
    api:
        container_name: cashtrack_api
        build:
            context: ./backend
            dockerfile: Dockerfile.dev
        ports:
            - 8000:8000
            - 9229:9229
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ./backend:/app/backend
            - /app/backend/node_modules
        env_file:
            - ./backend/.env

    postgres:
        image: postgres
        container_name: cashtrack_db
        environment:
            POSTGRES_USER: root
            POSTGRES_PASSWORD: root
            POSTGRES_DB: cashtrack
        ports:
            - 5432:5432
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U root -d cashtrack']
            interval: 5s
            timeout: 5s
            retries: 5

    postgres_test:
        image: postgres
        container_name: cashtrack_db_test
        environment:
            POSTGRES_USER: root
            POSTGRES_PASSWORD: root
            POSTGRES_DB: cashtrack_test
        ports:
            - 5433:5432
        tmpfs:
            - /var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U root -d cashtrack_test']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
