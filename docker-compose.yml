services:
    api:
        container_name: cashtrack_api
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - 8000:8000
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ./backend:/app/backend
            - /app/backend/node_modules\
        env_file:
            - ./backend/env

    postgres:
        image: postgres
        container_name: cashtrack_db
        environment:
            POSTGRES_USER: root
            POSTGRES_PASSWORD: root
            POSTGRES_DB: cashtrack
        ports:
            - 5432:5432
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U root']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
