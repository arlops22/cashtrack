name: CashTrack CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        name: Run NodeJS Integration Tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cashtrack_test
            JWT_SECRET: ci-test-secret
        services:
            postgres:
                image: postgres
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: cashtrack_test
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: '24.x'
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: Install Dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npm run prisma:generate

            - name: Type check and lint
              run: |
                  npm run type-check
                  npm run lint

            - name: Apply migrations
              run: npm run migrate:deploy

            - name: Run integration tests
              run: npm test

    build-backend:
        name: Build backend Dockerfile
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout project
              uses: actions/checkout@v6

            - name: Build backend Dockerfile
              run: docker build -f ./backend/Dockerfile -t backend ./backend
